<div class="colleges-section" *ngIf="!(loading$ | async) && !(error$ | async)" >
  <app-filter-input (search)="performSearch($event)"></app-filter-input>
  <app-college-table [data]="colleges$ | async" [filterText]="filter" (selectItem)="showDetails($event)"></app-college-table>
</div>

<div *ngIf="loading$ | async" class="loading" class="loading-container" role="status" aria-live="polite">
  Loading colleges...
</div>
<div *ngIf="error$ | async as error" class="error" class="error-container" role="alert" aria-live="assertive">
  Error loading colleges
</div>
